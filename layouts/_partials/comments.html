{{/* Artalk comment system */}}
{{ if and .Page (not .Params.nocomment) }}
<section id="comments" class="my-12">
  <h2 class="text-xl font-semibold mb-6">Comments</h2>
  <div id="ArtalkComments"></div>
</section>

{{- $pageTitle := .Page.Title }}
{{- $pageKey := .Page.RelPermalink }}
<script>
  var ArtalkConfig = {
    el: '#ArtalkComments',
    pageKey: '{{ $pageKey }}',
    pageTitle: '{{ $pageTitle }}',
    server: 'https://comments.tianheg.co',
    site: 'Tianhe Gao',
    darkMode: 'auto',
    useStickyEditor: true,
  };
</script>
<script src="https://comments.tianheg.co/dist/Artalk.js"></script>
{{ end }}
