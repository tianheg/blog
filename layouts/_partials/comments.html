{{/* Artalk comment system */}}
{{ if not .Params.nocomment }}
<section id="comments" class="my-12">
  <h2 class="text-xl md:text-2xl font-semibold mt-10 md:mt-12 mb-6 text-gray-900 dark:text-gray-100 flex flex-row items-center space-x-2">
    {{ partial "svg/message-circle" }}
    <span>Comments</span>
  </h2>

  <p class="mb-6 text-center">
    <a href="mailto:i@tianheg.co?subject=[tianheg.co] Re: {{ .Title }}" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 underline">
      ✍️ Reply by email
    </a>
  </p>

  <div id="Comments"></div>
</section>

<link href="/dist/Artalk.css" rel="stylesheet">
<script src="/dist/Artalk.js"></script>
<script>
  (function () {
    var root = document.documentElement;
    // darkMode 不能用 'auto'：那只认 prefers-color-scheme，站内主题（ThemeToggle：
    // html.dark/.light + localStorage）可与系统偏好背离 → Artalk 字色与页面底色同侧，
    // 评论正文对比度掉到 1.1:1（实测）。唯一真相 = html 的类，初始化即取它。
    var artalk = Artalk.init({
      el: '#Comments',
      pageKey: '{{ .Permalink }}',
      pageTitle: '{{ .Title }}',
      // 生产走同域反代（'' → /api/v2/*、/dist/* 由 blog Worker 转发），
      // 页面源码不再出现 comments.tianheg.co；hugo serve 开发时 Worker 不可达，退回直连
      server: '{{ cond hugo.IsDevelopment "https://comments.tianheg.co" "" }}',
      site: 'Tianhe Gao',
      darkMode: root.classList.contains('dark'),
    });
    // 主题一切就同步：手动切换与「跟随系统」两条路径 ThemeToggle 都只改 html 的类，
    // setDarkMode 走 Artalk 内部 watchConf，同时撤掉它自带的 media 监听。
    var sync = function () { artalk.setDarkMode(root.classList.contains('dark')); };
    var last = root.classList.contains('dark');
    // 加载后 ~460ms 服务端 /api/v2/conf 合并会把 darkMode 重置回 init 旧值：
    // 此前点开关会被覆盖、created 再按旧值摘类（实测 1.26:1 字底反相）。
    // mounted 是合并之后的第一个事件，在此重新断言；conf 合并完成后点开关由下面 observer 兜。
    artalk.on('mounted', sync);
    new MutationObserver(function () {
      var dark = root.classList.contains('dark');
      if (dark === last) return;
      last = dark;
      sync();
    }).observe(root, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
{{ end }}
