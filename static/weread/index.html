<script>

  const badges = [b.finished?'<span class="badge done">读完</span>':'', b.secret?'<span class="badge secret">私密</span>':''].join('');
  return `<a class="row ${b.finished?'finish':''}" href="${esc(b.deepLink||'#')}" target="_blank" rel="noopener">
    ${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy">`:'<div style="width:30px;height:40px;background:#2d2d4a;border-radius:3px;flex-shrink:0"></div>'}
    <div class="r-main"><div class="r-title">${esc(b.title)}</div><div class="r-sub">${esc(b.author||'')}${b.category?' · '+esc(b.category):''}</div></div>
    <span class="r-meta">${fmtDate(b.readUpdateTime)}</span>${badges}</a>`;
};
const NOTE_ITEMS = nb => {
  let h = '';
  for (const r of nb.reviews||[]) {
    const rv = r.review || r;
    h += `<div class="nt" style="margin-top:6px">💭 想法${rv.chapterName?` · <span class="nt-c">${esc(rv.chapterName)}</span>`:''}</div><div class="nt-t">${esc(rv.content||'')}</div>`;
  }
  const chapMap = new Map((nb.chapters||[]).map(c => [c.chapterUid, c.title]));
  for (const hl of nb.bookmarks||[]) {
    h += `<div class="nt" style="margin-top:6px">✏️ 划线${chapMap.get(hl.chapterUid)?` · <span class="nt-c">${esc(chapMap.get(hl.chapterUid))}</span>`:''}</div><div class="nt-t">${esc(hl.markText||'')}</div>`;
  }
  return h || '<div class="muted">无笔记内容</div>';
};
const NOTE_ROW = nb => {
  const count = (nb.reviewCount||0)+(nb.noteCount||0)+(nb.bookmarkCount||0);
  return `<div class="row" data-bid="${esc(nb.id)}" onclick="noteOpen(this)">
    ${nb.cover?`<img src="${esc(nb.cover)}" alt="" loading="lazy">`:'<div style="width:30px;height:40px;background:#2d2d4a;border-radius:3px;flex-shrink:0"></div>'}
    <div class="r-main"><div class="r-title">${esc(nb.title||'?')}</div><div class="r-sub">${esc(nb.author||'')}</div></div>
    <span class="r-meta">${count} 条</span></div>
    <div class="note-detail"><span class="muted">点击展开…</span></div>`;
};
let detailCache = null;
async function getDetail() {
  if (!detailCache) {
    const r = await fetch('/weread/api/notes-detail.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    detailCache = (await r.json()).books || {};
  }
  return detailCache;
}
async function noteOpen(rowEl) {
  const body = rowEl.nextElementSibling;
  const bid = rowEl.dataset.bid;
  if (!body.dataset.loaded) {
    try {
      const det = await getDetail();
      body.innerHTML = NOTE_ITEMS(det[bid] || {});
      body.dataset.loaded = '1';
    } catch (e) {
      body.innerHTML = '<span class="badge-err">⚠️ 笔记加载失败</span>';
    }
  }
  body.classList.toggle('open');
}
const PAGER = (page, pages, total, q, fn) => `<button class="btn" onclick="${fn}(${page-1})" ${page<=0?'disabled':''}>‹ 上一页</button>
  <span class="pager-info">${page+1} / ${pages} · 共 ${total}${q?'（筛选）':''}</span>
  <button class="btn" onclick="${fn}(${page+1})" ${page>=pages-1?'disabled':''}>下一页 ›</button>`;

/* ---------- 聚合总览 ---------- */
function viewAll() {
  const ov = MODES.overall || {}, an = MODES.annually || {};
  const cards = [
    [B.length, '书架书目'], [B.filter(x=>!x.finished).length, '在读'], [B.filter(x=>x.finished).length, '读完'],
    [D.notebooks.totalBookCount, '有笔记的书'], [D.notebooks.totalNoteCount, '笔记总数'],
    [fmtDur(ov.totalReadTime), '累计阅读'], [fmtDur(an.totalReadTime), '今年阅读'],
  ];
  const recent = B.filter(x=>!x.finished).sort((x,y)=>y.readUpdateTime-x.readUpdateTime).slice(0,10);
  const cnt = nb => (nb.reviewCount||0)+(nb.noteCount||0)+(nb.bookmarkCount||0);
  const noteTop = N.slice().sort((a,b)=>cnt(b)-cnt(a)).slice(0,5);
  $('#all').innerHTML = `<div class="grid">${cards.map(([v,l]) => `<div class="card"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('')}</div>
    <h2>最近在读</h2><div class="rows">${recent.map(ROW).join('')}</div>
    <h2 style="margin-top:20px">笔记 Top 5（点击展开）</h2><div class="rows">${noteTop.map(NOTE_ROW).join('')}</div>`;
}

/* ---------- 书架 ---------- */
function viewBooks() {
  $('#books').innerHTML = `<div class="list-head"><h2>书架 · ${B.length} 本</h2><input class="search" id="bq" placeholder="搜索书名 / 作者…"></div>
    <div id="bl" class="rows"></div><div id="bp" class="pager"></div>`;
  const q = $('#bq');
  let f = B.slice(), p = 0;
  const draw = () => {
    const kw = (q.value||'').toLowerCase();
    const list = kw ? f.filter(x => (x.title+' '+(x.author||'')).toLowerCase().includes(kw)) : f;
    const pages = Math.ceil(list.length/50);
    p = Math.min(p, Math.max(0, pages-1));
    const slice = list.slice(p*50, (p+1)*50);
    $('#bl').innerHTML = slice.map(ROW).join('');
    $('#bp').innerHTML = list.length ? PAGER(p, pages, list.length, !!kw, 'booksGo') : '<span class="muted">无匹配</span>';
    window.booksGo = p2 => { p = p2; draw(); };
  };
  q.addEventListener('input', () => { p = 0; draw(); });
  draw();
}

/* ---------- 笔记 ---------- */
function viewNotes() {
  $('#notes').innerHTML = `<div class="list-head"><h2>笔记 · ${D.notebooks.totalBookCount} 本 / ${D.notebooks.totalNoteCount} 条</h2><input class="search" id="nq" placeholder="搜索书名 / 作者…"></div>
    <div class="muted" style="margin-bottom:10px">点击条目展开划线与想法（首次展开按需加载全文）</div>
    <div id="nl" class="rows"></div><div id="np" class="pager"></div>`;
  const q = $('#nq');
  let f = N.slice(), p = 0;
  const draw = () => {
    const kw = (q.value||'').toLowerCase();
    const list = kw ? f.filter(x => (x.title+' '+(x.author||'')).toLowerCase().includes(kw)) : f;
    const pages = Math.ceil(list.length/50);
    p = Math.min(p, Math.max(0, pages-1));
    const slice = list.slice(p*50, (p+1)*50);
    $('#nl').innerHTML = slice.map(NOTE_ROW).join('');
    $('#np').innerHTML = list.length ? PAGER(p, pages, list.length, !!kw, 'notesGo') : '<span class="muted">无匹配</span>';
    window.notesGo = p2 => { p = p2; draw(); };
  };
  q.addEventListener('input', () => { p = 0; draw(); });
  draw();
}

/* ---------- 统计 ---------- */
function viewStats() {
  $('#stats').innerHTML = Object.entries(MODES).map(([mode, d]) => {
    const st = Object.fromEntries((d.readStat||[]).map(s => [s.stat, s.counts]));
    const top = (d.readLongest||[]).slice(0,5).map(x => {
      const bk = x.book || {};
      return `<div class="row"><div class="r-main"><div class="r-title">${esc(bk.title||'?')}</div><div class="r-sub">${esc(bk.author||'')}</div></div><span class="r-meta">${fmtDur(x.readTime)}</span></div>`;
    }).join('');
    return `<h2>${LABEL[mode]||mode}</h2>
      <div class="grid">${[['时长',fmtDur(d.totalReadTime)],['天数',d.readDays||0],['日均',fmtDur(d.dayAverageReadTime)],['读完',st['读完']||'—']].map(([l,v]) => `<div class="card"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('')}</div>
      <div class="rows" style="margin-bottom:20px">${top}</div>`;
  }).join('');
}

/* ---------- tabs + init ---------- */
const VIEWS = {all: viewAll, books: viewBooks, notes: viewNotes, stats: viewStats};
function init() {
  const ov = MODES.overall || {};
  $('#subline').textContent = `注册于 ${fmtDate(D.registTime)} · 数据更新于 ${D.generated} · 每日自动刷新`;
  $('#endpoints').innerHTML = ENDPOINTS.map(([u, l]) =>
    `<a class="endpoint" href="${u}" target="_blank" rel="noopener"><span>📄 ${l}.json</span><span class="size">JSON</span></a>`).join('');
  $$('.tab').forEach(t => t.addEventListener('click', () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    $$('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('#' + t.dataset.panel).classList.add('active');
    VIEWS[t.dataset.panel]();
  }));
  VIEWS.all();
}
init();
</script>
</body>
</html>
