<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信读书 · API 数据</title>
<meta name="description" content="微信读书数据 API 聚合入口：书架、笔记、阅读统计，可点击浏览。">
<style>
:root{--bg:#0d0d1a;--card:#161627;--card2:#1c1c31;--fg:#e2e8f0;--muted:#94a3b8;--accent:#e879f9;--accent2:#38bdf8;--ok:#4ade80;--border:#26263e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;line-height:1.55}
.wrap{width:min(100%,1100px);margin:0 auto;padding:20px clamp(12px,3vw,32px) 60px}
h1{font-size:clamp(1.3rem,4vw,1.7rem)}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 16px}
.endpoints{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.endpoint{padding:7px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);text-decoration:none;font-size:.82rem;display:flex;gap:6px;align-items:center}
.endpoint:hover{border-color:var(--accent2);color:var(--fg)}
.endpoint .size{color:#64748b}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.9rem}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d0d1a;font-weight:600;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-val{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{color:var(--muted);font-size:.78rem;margin-top:2px}
h2{font-size:1rem;margin-bottom:12px}
.list-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.search{background:var(--card2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:.85rem;width:min(100%,260px);outline:none}
.search:focus{border-color:var(--accent2)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--fg);border:1px solid transparent}
.row:hover{background:var(--card2);border-color:var(--border)}
.row img{width:30px;height:40px;object-fit:cover;border-radius:3px;flex-shrink:0}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-size:.87rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-sub{color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-meta{color:var(--accent2);font-size:.78rem;flex-shrink:0;font-variant-numeric:tabular-nums}
.row.finish .r-title{color:#64748b}
.badge{font-size:.65rem;border-radius:4px;padding:1px 5px;background:#2d2d4a;color:var(--muted);flex-shrink:0}
.badge.done{color:var(--ok)}
.badge.secret{color:var(--warn)}
.pager{display:flex;gap:8px;align-items:center;margin-top:14px}
.btn{padding:6px 16px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--fg);cursor:pointer;font-size:.84rem}
.btn:disabled{opacity:.4;cursor:default}
.btn:hover:not(:disabled){border-color:var(--accent2)}
.pager-info{color:var(--muted);font-size:.8rem}
.note-detail{display:none;border-left:2px solid var(--accent);margin:4px 0 4px 8px;padding:6px 12px;background:var(--card2);border-radius:0 8px 8px 0}
.note-detail.open{display:block}
.nt{font-size:.72rem;color:var(--muted)}
.nt-c{color:var(--accent2);font-size:.72rem}
.nt-t{font-size:.83rem;margin-top:2px}
.muted{color:var(--muted);font-size:.82rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;color:var(--muted);word-break:break-all}
footer{color:#64748b;font-size:.73rem;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 微信读书 · API 数据</h1>
<div class="sub" id="subline"></div>
<div class="endpoints" id="endpoints"></div>
<nav class="tabs">
<button class="tab active" data-t="all">📦 聚合总览</button>
<button class="tab" data-t="books">📚 书架</button>
<button class="tab" data-t="notes">✏️ 笔记</button>
<button class="tab" data-t="stats">📊 统计</button>
</nav>
<div id="content"></div>
<footer>数据来源：微信读书 API · 每日更新 · JSON 端点见上方链接</footer>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = sec => { sec = Math.max(0, Math.round(sec||0)); const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60); return h>0 ? `${h} 小时 ${m} 分` : (m>0 ? `${m} 分钟` : `${sec} 秒`); };
const fmtDate = ts => { const d = new Date(ts*1000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

let DATA = null;
const ENDPOINTS = [
  ['index.json', '聚合数据', '全部'],
  ['books.json', '书架 494 本', '全量'],
  ['notes.json', '笔记 282 本', '含详情'],
  ['stats.json', '阅读统计', '4 模式'],
];

function fmtSize(bytes) { return bytes > 1024*1024 ? (bytes/1024/1024).toFixed(1)+' MB' : Math.round(bytes/1024)+' KB'; }

function endpointLinks() {
  $('#endpoints').innerHTML = ENDPOINTS.map(([f, label, desc]) =>
    `<a class="endpoint" href="${f}" target="_blank" rel="noopener"><span>📄 ${label}</span><span class="size">${desc}</span></a>`).join('');
}

async function load() {
  try {
    const r = await fetch('index.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    $('#subline').textContent = `生成于 ${DATA.generated} · ${DATA.books.total} 本书 / ${DATA.notes.totalBookCount} 本有笔记 / ${DATA.notes.totalNoteCount} 条笔记`;
  } catch (e) {
    $('#subline').textContent = '⚠️ 数据加载失败: ' + e.message;
  }
  render('all');
}

/* ---------- 聚合总览 ---------- */
function renderAll() {
  if (!DATA) { $('#content').innerHTML = '<div class="muted">加载中…</div>'; return; }
  const b = DATA.books, n = DATA.notes, s = DATA.stats.modes;
  const ov = s.overall || {}, an = s.annually || {};
  const cards = [
    [b.total, '书架书目'], [b.reading, '在读'], [b.finished, '读完'],
    [n.totalBookCount, '有笔记的书'], [n.totalNoteCount, '笔记总数'],
    [fmtDur(ov.totalReadTime), '累计阅读'], [fmtDur(an.totalReadTime), '今年阅读'],
  ];
  const recent = b.books.filter(x=>!x.finished).sort((x,y)=>y.readUpdateTime-x.readUpdateTime).slice(0,10);
  const noteTop = Object.values(n.detail||{}).slice(0,5);
  $('#content').innerHTML = `
    <div class="grid">${cards.map(([v,l]) => `<div class="card"><div class="stat-val">${v}</div><div class="stat-label">${esc(l)}</div></div>`).join('')}</div>
    <h2>最近在读</h2><div class="rows">${recent.map(bookRow).join('')}</div>
    <h2 style="margin-top:20px">笔记 Top 5（点击展开）</h2><div class="rows">${noteTop.map(nb => {
      const bk = nb.book || {};
      return `<div class="row" onclick="this.nextElementSibling.classList.toggle('open')">
        ${bk.cover?`<img src="${esc(bk.cover)}" alt="" loading="lazy">`:'<div style="width:30px;height:40px;background:#2d2d4a;border-radius:3px;flex-shrink:0"></div>'}
        <div class="r-main"><div class="r-title">${esc(bk.title||'?')}</div><div class="r-sub">${esc(bk.author||'')}</div></div>
        <span class="r-meta">${(nb.reviewCount||0)+(nb.noteCount||0)+(nb.bookmarkCount||0)} 条</span></div>
        <div class="note-detail">${renderNoteItems(nb)}</div>`;
    }).join('')}</div>`;
}

function bookRow(b) {
  const badges = [b.finished?'<span class="badge done">读完</span>':'', b.secret?'<span class="badge secret">私密</span>':''].join('');
  return `<a class="row ${b.finished?'finish':''}" href="${esc(b.deepLink||'#')}" target="_blank" rel="noopener">
    ${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy">`:'<div style="width:30px;height:40px;background:#2d2d4a;border-radius:3px;flex-shrink:0"></div>'}
    <div class="r-main"><div class="r-title">${esc(b.title)}</div><div class="r-sub">${esc(b.author||'')}${b.category?' · '+esc(b.category):''}</div></div>
    <span class="r-meta">${fmtDate(b.readUpdateTime)}</span>${badges}</a>`;
}

function noteRow(nb) {
  const bk = nb.book || {};
  return `<div class="row" onclick="this.nextElementSibling.classList.toggle('open')">
    ${bk.cover?`<img src="${esc(bk.cover)}" alt="" loading="lazy">`:'<div style="width:30px;height:40px;background:#2d2d4a;border-radius:3px;flex-shrink:0"></div>'}
    <div class="r-main"><div class="r-title">${esc(bk.title||nb.title||'?')}</div><div class="r-sub">${esc(bk.author||nb.author||'')}</div></div>
    <span class="r-meta">${(nb.reviewCount||0)+(nb.noteCount||0)+(nb.bookmarkCount||0)} 条</span></div>
    <div class="note-detail">${renderNoteItems(nb)}</div>`;
}

function renderNoteItems(nb) {
  let h = '';
  for (const r of nb.reviews||[]) {
    const rv = r.review || r;
    h += `<div class="nt" style="margin-top:6px">💭 想法${rv.chapterName?` · <span class="nt-c">${esc(rv.chapterName)}</span>`:''}</div><div class="nt-t">${esc(rv.content||'')}</div>`;
  }
  const chapMap = new Map((nb.chapters||[]).map(c=>[c.chapterUid, c.title]));
  for (const hl of nb.bookmarks||[]) {
    h += `<div class="nt" style="margin-top:6px">✏️ 划线${chapMap.get(hl.chapterUid)?` · <span class="nt-c">${esc(chapMap.get(hl.chapterUid))}</span>`:''}</div><div class="nt-t">${esc(hl.markText||'')}</div>`;
  }
  return h || '<div class="muted">无笔记内容</div>';
}

/* ---------- 书架 ---------- */
let bookPage = 0, bookFiltered = [];
const BOOK_PER = 50;
function renderBooks() {
  if (!DATA) return;
  const b = DATA.books.books;
  bookFiltered = b.slice();
  bookPage = 0;
  drawBooks();
}
function drawBooks() {
  const q = ($('#book-q')?.value||'').toLowerCase();
  const list = q ? bookFiltered.filter(x => (x.title+' '+(x.author||'')).toLowerCase().includes(q)) : bookFiltered;
  const total = list.length, pages = Math.ceil(total/BOOK_PER);
  bookPage = Math.min(bookPage, Math.max(0, pages-1));
  const slice = list.slice(bookPage*BOOK_PER, (bookPage+1)*BOOK_PER);
  $('#book-list').innerHTML = slice.map(bookRow).join('');
  $('#book-pager').innerHTML = total ? `
    <button class="btn" onclick="bookPage--;drawBooks()" ${bookPage===0?'disabled':''}>‹ 上一页</button>
    <span class="pager-info">${bookPage+1} / ${pages} · 共 ${total} 本${q?`（筛选 "${esc(q)}"）`:''}</span>
    <button class="btn" onclick="bookPage++;drawBooks()" ${bookPage>=pages-1?'disabled':''}>下一页 ›</button>` : '<span class="muted">无匹配</span>';
}

/* ---------- 笔记 ---------- */
let notePage = 0, noteFiltered = [];
const NOTE_PER = 50;
function renderNotes() {
  if (!DATA) return;
  const list = DATA.notes.books.slice();
  noteFiltered = list;
  notePage = 0;
  drawNotes();
}
function drawNotes() {
  const q = ($('#note-q')?.value||'').toLowerCase();
  const list = q ? noteFiltered.filter(x => (x.title+' '+(x.author||'')).toLowerCase().includes(q)) : noteFiltered;
  const total = list.length, pages = Math.ceil(total/NOTE_PER);
  notePage = Math.min(notePage, Math.max(0, pages-1));
  const slice = list.slice(notePage*NOTE_PER, (notePage+1)*NOTE_PER);
  $('#note-list').innerHTML = slice.map(nb => {
    const detail = DATA.notes.detail[nb.id];
    const row = noteRow(nb);
    if (detail) {
      // 替换 detail 内容为全量
      const d = document.createElement('div');
      d.innerHTML = row;
      d.querySelector('.note-detail').innerHTML = renderNoteItems(detail);
      return d.innerHTML;
    }
    return row;
  }).join('');
  $('#note-pager').innerHTML = total ? `
    <button class="btn" onclick="notePage--;drawNotes()" ${notePage===0?'disabled':''}>‹ 上一页</button>
    <span class="pager-info">${notePage+1} / ${pages} · 共 ${total} 本有笔记${q?`（筛选 "${esc(q)}"）`:''}</span>
    <button class="btn" onclick="notePage++;drawNotes()" ${notePage>=pages-1?'disabled':''}>下一页 ›</button>` : '<span class="muted">无匹配</span>';
}

/* ---------- 统计 ---------- */
function renderStats() {
  if (!DATA) return;
  const m = DATA.stats.modes;
  $('#content').innerHTML = Object.entries(m).map(([mode, d]) => {
    const st = Object.fromEntries((d.readStat||[]).map(s=>[s.stat, s.counts]));
    const top = (d.readLongest||[]).slice(0,5).map(x => {
      const bk = x.book || {};
      return `<div class="row"><div class="r-main"><div class="r-title">${esc(bk.title||'?')}</div><div class="r-sub">${esc(bk.author||'')}</div></div><span class="r-meta">${fmtDur(x.readTime)}</span></div>`;
    }).join('');
    return `<h2>${MODE[mode]||mode}</h2>
      <div class="grid">${[['时长',fmtDur(d.totalReadTime)],['天数',d.readDays],['日均',fmtDur(d.dayAverageReadTime)],['读完',st['读完']||'—']].map(([l,v])=>`<div class="card"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('')}</div>
      <div class="rows" style="margin-bottom:20px">${top}</div>`;
  }).join('');
}
const MODE = {weekly:'本周', monthly:'本月', annually:'今年', overall:'总计'};

/* ---------- tabs ---------- */
const $ = s => document.querySelector(s);
$$ = s => Array.from(document.querySelectorAll(s));
function render(t) {
  const el = $('#content');
  if (!DATA) { el.innerHTML = '<div class="muted">加载中…</div>'; return; }
  if (t === 'all') return renderAll();
  if (t === 'books') {
    el.innerHTML = `<div class="list-head"><h2>书架 · ${DATA.books.total} 本</h2><input class="search" id="book-q" placeholder="搜索书名 / 作者…" oninput="drawBooks()"></div>
      <div id="book-list" class="rows"></div><div id="book-pager" class="pager"></div>`;
    renderBooks();
  } else if (t === 'notes') {
    el.innerHTML = `<div class="list-head"><h2>笔记 · ${DATA.notes.totalBookCount} 本 / ${DATA.notes.totalNoteCount} 条</h2><input class="search" id="note-q" placeholder="搜索书名 / 作者…" oninput="drawNotes()"></div>
      <div class="muted" style="margin-bottom:10px">点击条目展开划线与想法（Top 10 本含全文）</div>
      <div id="note-list" class="rows"></div><div id="note-pager" class="pager"></div>`;
    renderNotes();
  } else if (t === 'stats') {
    renderStats();
  }
}
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  render(t.dataset.t);
}));

endpointLinks();
load();
</script>
</body>
</html>
