<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熬夜日历 · Overnight Calendar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@event-calendar/build@5.11.1/dist/event-calendar.min.css">
  <style>
    :root {
      --bg: #0b0b14;
      --surface: #141421;
      --surface2: #1c1c2e;
      --border: #2a2a3e;
      --text: #e2e0e8;
      --text2: #8a86a0;
      --text3: #5e5a78;
      --tag-coding: #f05454;
      --tag-reading: #4ecdc4;
      --tag-writing: #f0b429;
      --tag-work: #7c8cf0;
      --tag-thinking: #e89a5e;
      --tag-other: #6e6a86;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Override EventCalendar dark theme to match ours */
    body.ec-dark {
      --ec-bg-color: #141421;
      --ec-bg-event-color: var(--surface2);
      --ec-border-color: #2a2a3e;
      --ec-text-color: #e2e0e8;
      --ec-text-color-muted: #8a86a0;
      --ec-today-bg-color: rgba(240, 180, 41, 0.06);
      --ec-today-border-color: #f0b429;
    }
    body.ec-dark .ec-day.ec-today {
      background-color: rgba(240, 180, 41, 0.06);
    }
    body.ec-dark .ec-event {
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 0.65rem;
      line-height: 1.3;
      margin-bottom: 1px;
      border: none;
    }

    .page-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem;
    }

    /* Header */
    .header { margin-bottom: 1.75rem; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header h1 span {
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--text2);
      margin-left: 0.35rem;
    }
    .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.78rem;
      color: var(--text2);
    }
    .stats strong { color: var(--text); font-weight: 600; }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.9rem;
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--text2);
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-bar { display: block; width: 12px; height: 3px; border-radius: 2px; }

    /* Data bar */
    .data-bar {
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 7px;
      border: 1px solid var(--border);
    }
    .data-info {
      font-size: 0.7rem;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .data-info code {
      font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
      font-size: 0.65rem;
      color: var(--text);
      background: var(--surface2);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }
    .btn-download {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.12s;
      font-family: inherit;
    }
    .btn-download:active { background: var(--border); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.3rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    .modal h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1.1rem;
      color: var(--text);
    }
    .modal textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 0.65rem;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 72px;
      font-family: inherit;
      line-height: 1.5;
    }
    .modal textarea:focus { outline: none; border-color: #3a3a52; }
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.65rem 0;
    }
    .tag-btn {
      padding: 0.25rem 0.55rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .tag-btn.active { color: #fff; border-color: transparent; }
    .tag-btn[data-tag="coding"].active { background: var(--tag-coding); }
    .tag-btn[data-tag="reading"].active { background: var(--tag-reading); }
    .tag-btn[data-tag="writing"].active { background: var(--tag-writing); }
    .tag-btn[data-tag="work"].active { background: var(--tag-work); }
    .tag-btn[data-tag="thinking"].active { background: var(--tag-thinking); }
    .tag-btn[data-tag="other"].active { background: var(--tag-other); }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.85rem;
    }
    .modal-actions button {
      padding: 0.35rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
    }
    .btn-save { background: #f0b429; color: #0b0b14; font-weight: 500; }
    .btn-delete { background: transparent; color: var(--text2); border: 1px solid var(--border) !important; }
    .btn-cancel { background: transparent; color: var(--text2); }

    @media (max-width: 600px) {
      .page-wrap { padding: 0.85rem 0.5rem; }
      .header h1 { font-size: 1rem; }
      .header h1 span { font-size: 0.68rem; display: block; margin-left: 0; }
      .header-row { flex-direction: column; gap: 0.3rem; }
      .stats { font-size: 0.68rem; gap: 0.6rem; }
      .legend { font-size: 0.6rem; gap: 0.3rem 0.5rem; }
      .data-bar { flex-direction: column; align-items: stretch; }
      .data-info { justify-content: center; font-size: 0.65rem; }
      .btn-download { width: 100%; text-align: center; }
      .modal { padding: 1rem; }
      body.ec-dark .ec-event { font-size: 0.55rem; padding: 0 3px; }
    }
  </style>
</head>
<body class="ec-dark">
<div class="page-wrap">
  <div class="header">
    <div class="header-row">
      <h1>熬夜日历 <span>Overnight Calendar</span></h1>
      <div class="stats">
        <span>本月 <strong id="month-count">0</strong></span>
        <span>连续 <strong id="streak">0</strong> 天</span>
        <span>总计 <strong id="total-count">0</strong></span>
      </div>
    </div>
  </div>

  <div id="calendar"></div>

  <div class="legend">
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-coding)"></span>编码</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-reading)"></span>阅读</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-writing)"></span>写作</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-work)"></span>工作</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-thinking)"></span>胡思乱想</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-other)"></span>其他</span>
  </div>

  <div class="data-bar">
    <div class="data-info">
      <span>📄 <code>data.json</code></span>
      <span id="sync-status"></span>
    </div>
    <button class="btn-download" id="download-btn">💾 下载</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">记录</h2>
    <textarea id="modal-note" placeholder="熬到几点？做了什么？&#10;比如「写博客到凌晨 3 点」"></textarea>
    <div class="tag-group" id="tag-group">
      <button class="tag-btn" data-tag="coding">💻 编码</button>
      <button class="tag-btn" data-tag="reading">📖 阅读</button>
      <button class="tag-btn" data-tag="writing">✍️ 写作</button>
      <button class="tag-btn" data-tag="work">⚙️ 工作</button>
      <button class="tag-btn" data-tag="thinking">🤔 胡思乱想</button>
      <button class="tag-btn" data-tag="other">📌 其他</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-delete" id="modal-delete" style="display:none">删除</button>
      <button class="btn-save" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@event-calendar/build@5.11.1/dist/event-calendar.min.js"></script>
<script>
(function() {
  const STORAGE_KEY = 'overnight_calendar';
  let data = {};
  let ec = null;

  const tagColors = {
    coding: '#f05454',
    reading: '#4ecdc4',
    writing: '#f0b429',
    work: '#7c8cf0',
    thinking: '#e89a5e',
    other: '#6e6a86'
  };

  function key(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function get(y, m, d) { return data[key(y, m, d)] || null; }

  function set(y, m, d, entry) {
    const k = key(y, m, d);
    if (entry) data[k] = entry;
    else delete data[k];
    persist();
    updateStats();
    reloadEvents();
  }

  function sort(obj) {
    const r = {};
    Object.keys(obj).sort().forEach(k => { r[k] = obj[k]; });
    return r;
  }

  function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  function local() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch {}
    return null;
  }

  function merge(l, r) {
    const m = {}, ks = new Set([...Object.keys(l||{}), ...Object.keys(r||{})]);
    for (const k of ks) {
      const a = l?.[k], b = r?.[k];
      if (!b) { m[k] = a; continue; }
      if (!a) { m[k] = b; continue; }
      m[k] = (a.timestamp||0) >= (b.timestamp||0) ? a : b;
    }
    return m;
  }

  async function sync() {
    const l = local();
    let r = null;
    try {
      const res = await fetch('data.json?' + Date.now());
      if (res.ok) r = await res.json();
    } catch {}
    const status = document.getElementById('sync-status');
    if (l && r) {
      const m = merge(l, r);
      const c = Object.keys(m).filter(k => l[k] && r[k] && l[k].timestamp !== r[k].timestamp);
      data = m;
      status.textContent = c.length ? `合并 ${c.length} 条冲突` : '已同步';
    } else if (r) { data = r; status.textContent = '已同步'; }
    else if (l) { data = l; status.textContent = '本地'; }
    else { data = {}; status.textContent = '暂无数据'; }
    persist();
    updateStats();
  }

  function updateStats() {
    const n = new Date();
    let mc = 0, tc = 0, s = 0;
    for (let d = 1; d <= 31; d++) { if (get(n.getFullYear(), n.getMonth(), d)) mc++; }
    for (const k in data) { tc++; }
    for (let i = 0; i < 365; i++) {
      const d = new Date(n); d.setDate(d.getDate() - i);
      if (get(d.getFullYear(), d.getMonth(), d.getDate())) s++;
      else if (i > 0) break;
    }
    document.getElementById('month-count').textContent = mc;
    document.getElementById('total-count').textContent = tc;
    document.getElementById('streak').textContent = s;
  }

  function toEvents() {
    const events = [];
    for (const [d, entry] of Object.entries(data)) {
      events.push({
        title: entry.note || (tagLabels[entry.tag] || '其他'),
        start: d,
        allDay: true,
        backgroundColor: tagColors[entry.tag] || '#6e6a86',
        textColor: '#0b0b14',
        extendedProps: { tag: entry.tag, note: entry.note || '' }
      });
    }
    return events;
  }

  const tagLabels = {
    coding:'编码', reading:'阅读', writing:'写作',
    work:'工作', thinking:'胡思乱想', other:'其他'
  };

  function reloadEvents() {
    if (ec) ec.setOption('events', toEvents());
  }

  function initCalendar() {
    ec = EventCalendar.create(document.getElementById('calendar'), {
      view: 'dayGridMonth',
      height: 'auto',
      locale: 'zh-CN',
      date: new Date(),
      events: toEvents(),
      headerToolbar: {
        start: 'title',
        center: '',
        end: 'prev,next today'
      },
      buttonText: { today: '今天', prev: '‹', next: '›' },
      dayMaxEvents: 2,
      dayHeaderFormat: { weekday: 'short' },
      datesSet: function() {},
      dateClick: function(info) {
        openModal(info.date.getFullYear(), info.date.getMonth(), info.date.getDate());
      },
      eventContent: function(arg) {
        return { html: `<span class="ec-event-title" style="font-size:inherit">${arg.event.title}</span>` };
      }
    });
  }

  function openModal(year, month, day) {
    const overlay = document.getElementById('modal');
    const note = document.getElementById('modal-note');
    const del = document.getElementById('modal-delete');
    const tags = document.querySelectorAll('.tag-btn');
    const title = document.getElementById('modal-title');
    const e = get(year, month, day);
    title.textContent = `${year} 年 ${month+1} 月 ${day} 日`;
    note.value = e ? (e.note||'') : '';
    del.style.display = e ? 'inline-block' : 'none';
    tags.forEach(b => b.classList.remove('active'));
    if (e && e.tag) tags.forEach(b => { if (b.dataset.tag === e.tag) b.classList.add('active'); });
    overlay.classList.add('show');
    overlay.dataset.year = year; overlay.dataset.month = month; overlay.dataset.day = day;
    note.focus();
  }

  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  function saveModal() {
    const o = document.getElementById('modal');
    const y = parseInt(o.dataset.year), m = parseInt(o.dataset.month), d = parseInt(o.dataset.day);
    const note = document.getElementById('modal-note').value.trim();
    const at = document.querySelector('.tag-btn.active');
    if (!note && !at) { set(y, m, d, null); }
    else { set(y, m, d, { note: note||'', tag: at ? at.dataset.tag : 'other', timestamp: Date.now() }); }
    closeModal();
  }

  function deleteEntry() {
    const o = document.getElementById('modal');
    set(parseInt(o.dataset.year), parseInt(o.dataset.month), parseInt(o.dataset.day), null);
    closeModal();
  }

  function download() {
    const b = new Blob([JSON.stringify(sort(data), null, 2) + '\n'], {type:'application/json'});
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = 'data.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(u);
  }

  function bind() {
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-save').addEventListener('click', saveModal);
    document.getElementById('modal-delete').addEventListener('click', deleteEntry);
    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.getElementById('download-btn').addEventListener('click', download);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if ((e.metaKey||e.ctrlKey) && e.key === 'Enter' && document.getElementById('modal').classList.contains('show')) saveModal();
    });
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  }

  (async function init() {
    await sync();
    initCalendar();
    bind();
  })();
})();
</script>
</body>
</html>
