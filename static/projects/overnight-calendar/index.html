<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熬夜日历 · Overnight Calendar</title>
  <style>
    :root {
      --bg: #0b0b14;
      --surface: #141421;
      --surface2: #1c1c2e;
      --border: #2a2a3e;
      --border2: #3a3a52;
      --text: #e2e0e8;
      --text2: #8a86a0;
      --text3: #5e5a78;
      --accent: #f0b429;
      --moon-glow: rgba(240, 180, 41, 0.06);
      --tag-coding: #f05454;
      --tag-reading: #4ecdc4;
      --tag-writing: #f0b429;
      --tag-work: #7c8cf0;
      --tag-thinking: #e89a5e;
      --tag-other: #6e6a86;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      position: relative;
      min-height: 100vh;
    }

    /* Moon background decoration */
    body::before {
      content: '';
      position: fixed;
      top: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--moon-glow) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .moon {
      position: fixed;
      top: 28px;
      right: 32px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e8dcc8;
      box-shadow:
        0 0 40px rgba(232, 220, 200, 0.15),
        0 0 80px rgba(232, 220, 200, 0.05);
      z-index: 0;
      pointer-events: none;
    }
    .moon::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg);
      top: -6px;
      left: 10px;
    }

    .page-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header { margin-bottom: 1.75rem; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header h1 span {
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--text2);
      letter-spacing: 0;
      margin-left: 0.35rem;
    }
    .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.78rem;
      color: var(--text2);
      padding-top: 0.2rem;
    }
    .stats strong { color: var(--text); font-weight: 600; }

    /* Nav */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
    }
    .month-label {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
    }
    .nav-group { display: flex; align-items: center; gap: 0.3rem; }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.12s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:hover, .nav-btn:active {
      border-color: var(--border2);
      color: var(--text);
    }
    .nav-btn.today { font-size: 0.72rem; padding: 0.35rem 0.6rem; }

    /* Weekdays */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 3px;
    }
    .weekdays span {
      text-align: center;
      font-size: 0.68rem;
      color: var(--text3);
      padding: 0.35rem 0;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* Calendar */
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

    .day-cell {
      background: var(--surface);
      border-radius: 7px;
      padding: 5px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background 0.12s, transform 0.1s;
      position: relative;
      min-height: 42px;
      -webkit-tap-highlight-color: transparent;
    }
    .day-cell:active {
      background: var(--surface2);
      transform: scale(0.96);
    }
    .day-cell.other { opacity: 0.2; pointer-events: none; }
    .day-cell.today { border-color: var(--accent); }
    .day-cell .day-num {
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1;
    }
    .day-cell .day-tag {
      margin-top: 2px;
      font-size: 0.5rem;
      color: var(--text3);
      max-width: 95%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      line-height: 1.2;
    }
    .day-cell.has-entry { position: relative; }
    .day-cell.has-entry::before {
      content: '';
      position: absolute;
      top: -1.5px;
      left: 25%;
      right: 25%;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
    }
    .day-cell.has-entry.tag-coding::before { background: var(--tag-coding); }
    .day-cell.has-entry.tag-reading::before { background: var(--tag-reading); }
    .day-cell.has-entry.tag-writing::before { background: var(--tag-writing); }
    .day-cell.has-entry.tag-work::before { background: var(--tag-work); }
    .day-cell.has-entry.tag-thinking::before { background: var(--tag-thinking); }
    .day-cell.has-entry.tag-other::before { background: var(--tag-other); }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.9rem;
      margin-top: 1.1rem;
      font-size: 0.7rem;
      color: var(--text2);
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-bar { display: block; width: 12px; height: 3px; border-radius: 2px; }

    /* Data bar */
    .data-bar {
      margin-top: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.5rem 0.8rem;
      background: var(--surface);
      border-radius: 7px;
      border: 1px solid var(--border);
    }
    .data-info {
      font-size: 0.7rem;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .data-info code {
      font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
      font-size: 0.65rem;
      color: var(--text);
      background: var(--surface2);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }
    .btn-download {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.12s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-download:active { background: var(--border); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.3rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    .modal h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1.1rem;
      color: var(--text);
    }
    .modal textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 0.65rem;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 72px;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.12s;
    }
    .modal textarea:focus { outline: none; border-color: var(--border2); }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.65rem 0;
    }
    .tag-btn {
      padding: 0.25rem 0.55rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.12s;
      font-family: inherit;
    }
    .tag-btn:active { border-color: var(--border2); }
    .tag-btn.active { color: #fff; border-color: transparent; }
    .tag-btn[data-tag="coding"].active { background: var(--tag-coding); }
    .tag-btn[data-tag="reading"].active { background: var(--tag-reading); }
    .tag-btn[data-tag="writing"].active { background: var(--tag-writing); }
    .tag-btn[data-tag="work"].active { background: var(--tag-work); }
    .tag-btn[data-tag="thinking"].active { background: var(--tag-thinking); }
    .tag-btn[data-tag="other"].active { background: var(--tag-other); }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.85rem;
    }
    .modal-actions button {
      padding: 0.35rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
      transition: opacity 0.12s;
    }
    .modal-actions button:active { opacity: 0.7; }
    .btn-save { background: var(--accent); color: #0b0b14; font-weight: 500; }
    .btn-delete {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border) !important;
    }
    .btn-cancel { background: transparent; color: var(--text2); }

    /* Mobile */
    @media (max-width: 500px) {
      body::before { display: none; }
      .moon { top: 16px; right: 16px; width: 36px; height: 36px; }
      .moon::after { width: 30px; height: 30px; top: -4px; left: 7px; }

      .page-wrap { padding: 1rem 0.6rem; }
      .header { margin-bottom: 1.25rem; }
      .header h1 { font-size: 1.05rem; }
      .header h1 span { font-size: 0.7rem; display: block; margin-left: 0; margin-top: 0.1rem; }
      .header-row { flex-direction: column; gap: 0.4rem; }
      .stats { font-size: 0.7rem; gap: 0.7rem; }

      .nav { margin-bottom: 0.85rem; }
      .month-label { font-size: 0.9rem; }
      .nav-btn { padding: 0.35rem 0.6rem; font-size: 0.72rem; }
      .nav-btn.today { padding: 0.35rem 0.5rem; font-size: 0.65rem; }

      .weekdays span { font-size: 0.6rem; padding: 0.25rem 0; }
      .calendar { gap: 2px; }
      .day-cell {
        padding: 3px 2px;
        min-height: 36px;
        border-radius: 5px;
      }
      .day-cell .day-num { font-size: 0.72rem; }
      .day-cell .day-tag { font-size: 0.45rem; margin-top: 1px; }
      .day-cell.has-entry::before { left: 30%; right: 30%; height: 2px; }

      .legend { font-size: 0.62rem; gap: 0.35rem 0.6rem; margin-top: 0.85rem; }
      .legend-bar { width: 10px; }

      .data-bar { flex-direction: column; align-items: stretch; }
      .data-info { justify-content: center; }
      .btn-download { width: 100%; text-align: center; }

      .modal { padding: 1rem; max-width: 100%; margin: 0 0.5rem; }
      .modal textarea { font-size: 0.82rem; min-height: 64px; }
      .tag-btn { font-size: 0.68rem; padding: 0.25rem 0.5rem; }
    }

    @media (max-width: 380px) {
      .day-cell { min-height: 32px; }
      .day-cell .day-num { font-size: 0.65rem; }
      .day-cell .day-tag { font-size: 0.4rem; }
      .weekdays span { font-size: 0.55rem; }
    }
  </style>
</head>
<body>
<div class="moon"></div>

<div class="page-wrap">
  <div class="header">
    <div class="header-row">
      <h1>熬夜日历 <span>Overnight Calendar</span></h1>
      <div class="stats">
        <span>本月 <strong id="month-count">0</strong></span>
        <span>连续 <strong id="streak">0</strong> 天</span>
        <span>总计 <strong id="total-count">0</strong></span>
      </div>
    </div>
  </div>

  <div class="nav">
    <div class="nav-group">
      <button class="nav-btn" id="prev-btn">‹ 上月</button>
    </div>
    <span class="month-label" id="month-label"></span>
    <div class="nav-group">
      <button class="nav-btn today" id="today-btn">今天</button>
      <button class="nav-btn" id="next-btn">下月 ›</button>
    </div>
  </div>

  <div class="weekdays">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>

  <div class="calendar" id="calendar-grid"></div>

  <div class="legend">
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-coding)"></span>编码</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-reading)"></span>阅读</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-writing)"></span>写作</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-work)"></span>工作</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-thinking)"></span>胡思乱想</span>
    <span class="legend-item"><span class="legend-bar" style="background:var(--tag-other)"></span>其他</span>
  </div>

  <div class="data-bar">
    <div class="data-info">
      <span>📄 <code>data.json</code></span>
      <span id="sync-status"></span>
    </div>
    <button class="btn-download" id="download-btn">💾 下载</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">记录</h2>
    <textarea id="modal-note" placeholder="熬到几点？做了什么？&#10;比如「写博客到凌晨 3 点」"></textarea>
    <div class="tag-group" id="tag-group">
      <button class="tag-btn" data-tag="coding">💻 编码</button>
      <button class="tag-btn" data-tag="reading">📖 阅读</button>
      <button class="tag-btn" data-tag="writing">✍️ 写作</button>
      <button class="tag-btn" data-tag="work">⚙️ 工作</button>
      <button class="tag-btn" data-tag="thinking">🤔 胡思乱想</button>
      <button class="tag-btn" data-tag="other">📌 其他</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-delete" id="modal-delete" style="display:none">删除</button>
      <button class="btn-save" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'overnight_calendar';
  let data = {};
  let currentYear, currentMonth;

  function key(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function get(y, m, d) { return data[key(y, m, d)] || null; }

  function set(y, m, d, entry) {
    const k = key(y, m, d);
    if (entry) data[k] = entry;
    else delete data[k];
    persist();
    updateStats();
    render();
  }

  function sort(obj) {
    const r = {};
    Object.keys(obj).sort().forEach(k => { r[k] = obj[k]; });
    return r;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function local() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return null;
  }

  function merge(l, r) {
    const merged = {};
    const ks = new Set([...Object.keys(l||{}), ...Object.keys(r||{})]);
    for (const k of ks) {
      const a = l?.[k], b = r?.[k];
      if (!b) { merged[k] = a; continue; }
      if (!a) { merged[k] = b; continue; }
      merged[k] = (a.timestamp||0) >= (b.timestamp||0) ? a : b;
    }
    return merged;
  }

  async function sync() {
    const l = local();
    let r = null;
    try {
      const res = await fetch('data.json?' + Date.now());
      if (res.ok) r = await res.json();
    } catch {}
    const status = document.getElementById('sync-status');

    if (l && r) {
      const m = merge(l, r);
      const c = Object.keys(m).filter(k => {
        const a = l[k], b = r[k];
        return a && b && a.timestamp !== b.timestamp;
      });
      data = m;
      status.textContent = c.length ? `合并 ${c.length} 条冲突` : '已同步';
    } else if (r) {
      data = r;
      status.textContent = '已同步';
    } else if (l) {
      data = l;
      status.textContent = '本地';
    } else {
      data = {};
      status.textContent = '暂无数据';
    }
    persist();
    updateStats();
    render();
  }

  function updateStats() {
    const n = new Date();
    let mc = 0, tc = 0, s = 0;
    for (let d = 1; d <= 31; d++) { if (get(n.getFullYear(), n.getMonth(), d)) mc++; }
    for (const k in data) { tc++; }
    for (let i = 0; i < 365; i++) {
      const d = new Date(n); d.setDate(d.getDate() - i);
      if (get(d.getFullYear(), d.getMonth(), d.getDate())) s++;
      else if (i > 0) break;
    }
    document.getElementById('month-count').textContent = mc;
    document.getElementById('total-count').textContent = tc;
    document.getElementById('streak').textContent = s;
  }

  function render() {
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';
    const fd = new Date(currentYear, currentMonth, 1).getDay();
    const dim = new Date(currentYear, currentMonth + 1, 0).getDate();
    const dip = new Date(currentYear, currentMonth, 0).getDate();
    document.getElementById('month-label').textContent =
      `${currentYear} 年 ${currentMonth + 1} 月`;

    for (let i = fd - 1; i >= 0; i--)
      grid.appendChild(cell(currentYear, currentMonth - 1, dip - i, true));

    const t = new Date();
    for (let d = 1; d <= dim; d++)
      grid.appendChild(cell(currentYear, currentMonth, d, false,
        currentYear===t.getFullYear() && currentMonth===t.getMonth() && d===t.getDate()));

    const rem = (7 - (fd + dim) % 7) % 7;
    for (let d = 1; d <= rem; d++)
      grid.appendChild(cell(currentYear, currentMonth + 1, d, true));
  }

  function cell(year, month, day, other, today) {
    const div = document.createElement('div');
    div.className = 'day-cell';
    if (other) div.classList.add('other');
    if (today) div.classList.add('today');
    const e = get(year, month, day);
    if (e) {
      div.classList.add('has-entry', 'tag-' + e.tag);
      const tag = document.createElement('span');
      tag.className = 'day-tag';
      const labels = {
        coding:'编码', reading:'阅读', writing:'写作',
        work:'工作', thinking:'胡思乱想', other:'其他'
      };
      tag.textContent = labels[e.tag] || '其他';
      if (e.note) tag.textContent = e.note.slice(0, 8) + (e.note.length > 8 ? '..' : '');
      div.appendChild(tag);
    }
    const num = document.createElement('span');
    num.className = 'day-num';
    num.textContent = day;
    div.prepend(num);
    div.dataset.year = year; div.dataset.month = month; div.dataset.day = day;
    div.addEventListener('click', () => openModal(year, month, day));
    return div;
  }

  function openModal(year, month, day) {
    const overlay = document.getElementById('modal');
    const note = document.getElementById('modal-note');
    const del = document.getElementById('modal-delete');
    const tags = document.querySelectorAll('.tag-btn');
    const title = document.getElementById('modal-title');
    const e = get(year, month, day);
    title.textContent = `${year} 年 ${month+1} 月 ${day} 日`;
    note.value = e ? e.note||'' : '';
    del.style.display = e ? 'inline-block' : 'none';
    tags.forEach(b => b.classList.remove('active'));
    if (e && e.tag) tags.forEach(b => { if (b.dataset.tag === e.tag) b.classList.add('active'); });
    overlay.classList.add('show');
    overlay.dataset.year = year; overlay.dataset.month = month; overlay.dataset.day = day;
    note.focus();
  }

  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  function saveModal() {
    const o = document.getElementById('modal');
    const y = parseInt(o.dataset.year), m = parseInt(o.dataset.month), d = parseInt(o.dataset.day);
    const note = document.getElementById('modal-note').value.trim();
    const at = document.querySelector('.tag-btn.active');
    if (!note && !at) { set(y, m, d, null); }
    else { set(y, m, d, { note: note||'', tag: at ? at.dataset.tag : 'other', timestamp: Date.now() }); }
    closeModal();
  }

  function deleteEntry() {
    const o = document.getElementById('modal');
    set(parseInt(o.dataset.year), parseInt(o.dataset.month), parseInt(o.dataset.day), null);
    closeModal();
  }

  function download() {
    const b = new Blob([JSON.stringify(sort(data), null, 2) + '\n'], {type:'application/json'});
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = 'data.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(u);
  }

  function bind() {
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (--currentMonth < 0) { currentMonth=11; currentYear--; } render();
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (++currentMonth > 11) { currentMonth=0; currentYear++; } render();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      const n = new Date(); currentYear=n.getFullYear(); currentMonth=n.getMonth(); render();
    });
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-save').addEventListener('click', saveModal);
    document.getElementById('modal-delete').addEventListener('click', deleteEntry);
    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.getElementById('download-btn').addEventListener('click', download);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if ((e.metaKey||e.ctrlKey) && e.key === 'Enter' && document.getElementById('modal').classList.contains('show')) saveModal();
    });
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  }

  (async function init() {
    const n = new Date();
    currentYear = n.getFullYear(); currentMonth = n.getMonth();
    await sync();
    bind();
  })();
})();
</script>
</body>
</html>
