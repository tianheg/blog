<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熬夜日历 · Overnight Calendar</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #e8e8e8;
      --text2: #8892b0;
      --border: #2a2a4a;
      --tag-coding: #e94560;
      --tag-reading: #0f3460;
      --tag-writing: #f5a623;
      --tag-gaming: #00b4d8;
      --tag-social: #7209b7;
      --tag-work: #2d6a4f;
      --tag-thinking: #6b4f3c;
      --tag-other: #5a5a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }
    header h1 small {
      font-size: 0.875rem;
      color: var(--text2);
      font-weight: 400;
      margin-left: 0.5rem;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.875rem;
      color: var(--text2);
    }
    .stats span { white-space: nowrap; }
    .stats strong { color: var(--text); }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .nav-bar .month-label {
      font-size: 1.25rem;
      font-weight: 500;
    }
    .nav-bar button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.15s;
    }
    .nav-bar button:hover {
      background: var(--surface2);
    }
    .nav-bar button.today-btn {
      margin: 0 0.5rem;
      font-size: 0.75rem;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 2px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 0.875rem;
      transition: background 0.15s, transform 0.1s;
      min-height: 60px;
      border: 1px solid transparent;
    }
    .day-cell:hover {
      background: var(--surface2);
      transform: scale(1.03);
      z-index: 1;
    }
    .day-cell.other-month {
      opacity: 0.25;
      pointer-events: none;
    }
    .day-cell.today {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(233, 69, 96, 0.3);
    }
    .day-cell .date-num {
      font-size: 0.8rem;
      font-weight: 500;
    }
    .day-cell .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 3px;
    }

    .day-cell.has-entry {
      border-color: var(--accent2);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 420px;
      border: 1px solid var(--border);
    }
    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .modal h2 small {
      color: var(--text2);
      font-weight: 400;
    }
    .modal label {
      display: block;
      font-size: 0.8rem;
      color: var(--text2);
      margin-bottom: 0.4rem;
      margin-top: 1rem;
    }
    .modal textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.6rem;
      font-size: 0.875rem;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
    }
    .modal textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .tag-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.5rem 0;
    }
    .tag-btn {
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tag-btn.active {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--text2);
    }
    .tag-btn[data-tag="coding"] { border-color: var(--tag-coding); }
    .tag-btn[data-tag="coding"].active { background: var(--tag-coding); color: #fff; }
    .tag-btn[data-tag="reading"] { border-color: var(--tag-reading); }
    .tag-btn[data-tag="reading"].active { background: var(--tag-reading); color: #fff; }
    .tag-btn[data-tag="writing"] { border-color: var(--tag-writing); }
    .tag-btn[data-tag="writing"].active { background: var(--tag-writing); color: #000; }
    .tag-btn[data-tag="gaming"] { border-color: var(--tag-gaming); }
    .tag-btn[data-tag="gaming"].active { background: var(--tag-gaming); color: #000; }
    .tag-btn[data-tag="social"] { border-color: var(--tag-social); }
    .tag-btn[data-tag="social"].active { background: var(--tag-social); color: #fff; }
    .tag-btn[data-tag="work"] { border-color: var(--tag-work); }
    .tag-btn[data-tag="work"].active { background: var(--tag-work); color: #fff; }
    .tag-btn[data-tag="thinking"] { border-color: var(--tag-thinking); }
    .tag-btn[data-tag="thinking"].active { background: var(--tag-thinking); color: #fff; }
    .tag-btn[data-tag="other"] { border-color: var(--tag-other); }
    .tag-btn[data-tag="other"].active { background: var(--tag-other); color: #fff; }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .modal-actions button {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      transition: opacity 0.15s;
    }
    .modal-actions button:hover { opacity: 0.85; }
    .btn-save {
      background: var(--accent);
      color: #fff;
    }
    .btn-delete {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border) !important;
    }
    .btn-cancel {
      background: transparent;
      color: var(--text2);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text2);
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .data-footprint {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--text2);
    }
    .data-footprint a {
      color: var(--accent2);
      text-decoration: none;
    }
    .data-footprint a:hover { text-decoration: underline; }

    @media (max-width: 500px) {
      body { padding: 1rem 0.5rem; }
      .day-cell { min-height: 48px; font-size: 0.8rem; }
      header h1 { font-size: 1.2rem; }
      .stats { font-size: 0.75rem; gap: 0.75rem; flex-wrap: wrap; }
      .modal { padding: 1rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌙 熬夜日历 <small>Overnight Calendar</small></h1>
    <div class="stats" id="stats">
      <span>本月熬夜 <strong id="month-count">0</strong> 天</span>
      <span>连续 <strong id="streak">0</strong> 天</span>
      <span>总计 <strong id="total-count">0</strong> 天</span>
    </div>
  </header>

  <div class="nav-bar">
    <button id="prev-btn">‹ 上月</button>
    <div>
      <span class="month-label" id="month-label"></span>
      <button class="today-btn" id="today-btn">今天</button>
    </div>
    <button id="next-btn">下月 ›</button>
  </div>

  <div class="weekdays">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-coding)"></span> 编码</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-reading)"></span> 阅读</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-writing)"></span> 写作</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-gaming)"></span> 游戏</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-social)"></span> 社交</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-work)"></span> 工作</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-thinking)"></span> 胡思乱想</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--tag-other)"></span> 其他</span>
  </div>

  <div class="data-footprint">
    数据存储在浏览器本地 (localStorage)，不会上传。开源在 <a href="https://git.tianheg.co/tianheg/blog/src/branch/main/static/projects/overnight-calendar/index.html" target="_blank">git.tianheg.co</a>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">日期 <small id="modal-date"></small></h2>
    <label>熬到几点？做了什么？</label>
    <textarea id="modal-note" placeholder="写点什么… 比如「写博客到凌晨 3 点」「打游戏到 2 点」「读完了《XXX》」"></textarea>

    <label>标签</label>
    <div class="tag-selector" id="tag-selector">
      <button class="tag-btn" data-tag="coding">💻 编码</button>
      <button class="tag-btn" data-tag="reading">📖 阅读</button>
      <button class="tag-btn" data-tag="writing">✍️ 写作</button>
      <button class="tag-btn" data-tag="gaming">🎮 游戏</button>
      <button class="tag-btn" data-tag="social">💬 社交</button>
      <button class="tag-btn" data-tag="work">⚙️ 工作</button>
      <button class="tag-btn" data-tag="thinking">🤔 胡思乱想</button>
      <button class="tag-btn" data-tag="other">📌 其他</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-delete" id="modal-delete" style="display:none">删除</button>
      <button class="btn-save" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'overnight_calendar';

  let data = loadData();
  let currentYear, currentMonth;

  function init() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    updateStats();
    render();
    bindEvents();
  }

  function loadData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch { return {}; }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    updateStats();
  }

  function dateKey(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  function getEntry(y, m, d) { return data[dateKey(y, m, d)]; }
  function setEntry(y, m, d, entry) {
    const k = dateKey(y, m, d);
    if (entry) { data[k] = entry; }
    else { delete data[k]; }
    saveData();
    render();
  }

  function updateStats() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    let monthCount = 0, totalCount = 0;
    let currentStreak = 0;

    // Month count
    for (let d = 1; d <= 31; d++) {
      if (getEntry(y, m, d)) monthCount++;
    }
    // Total count
    for (const k in data) { totalCount++; }

    // Current streak (backwards from today)
    const today = new Date();
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      if (getEntry(d.getFullYear(), d.getMonth(), d.getDate())) {
        currentStreak++;
      } else if (i > 0) {
        break;
      }
    }

    document.getElementById('month-count').textContent = monthCount;
    document.getElementById('total-count').textContent = totalCount;
    document.getElementById('streak').textContent = currentStreak;
  }

  function render() {
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

    document.getElementById('month-label').textContent =
      `${currentYear} 年 ${currentMonth + 1} 月`;

    // Previous month tail
    for (let i = firstDay - 1; i >= 0; i--) {
      const cell = createCell(currentYear, currentMonth - 1, daysInPrev - i, true);
      grid.appendChild(cell);
    }

    // Current month
    const today = new Date();
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = currentYear === today.getFullYear() &&
                      currentMonth === today.getMonth() &&
                      d === today.getDate();
      const cell = createCell(currentYear, currentMonth, d, false, isToday);
      grid.appendChild(cell);
    }

    // Next month head
    const totalCells = firstDay + daysInMonth;
    const remaining = (7 - totalCells % 7) % 7;
    for (let d = 1; d <= remaining; d++) {
      const cell = createCell(currentYear, currentMonth + 1, d, true);
      grid.appendChild(cell);
    }
  }

  function createCell(year, month, day, isOther, isToday) {
    const div = document.createElement('div');
    div.className = 'day-cell';
    if (isOther) div.classList.add('other-month');
    if (isToday) div.classList.add('today');

    const entry = getEntry(year, month, day);
    if (entry) {
      div.classList.add('has-entry');
      const dot = document.createElement('div');
      dot.className = 'dot';
      const colors = {
        coding: 'var(--tag-coding)',
        reading: 'var(--tag-reading)',
        writing: 'var(--tag-writing)',
        gaming: 'var(--tag-gaming)',
        social: 'var(--tag-social)',
        work: 'var(--tag-work)',
        thinking: 'var(--tag-thinking)',
        other: 'var(--tag-other)'
      };
      dot.style.background = colors[entry.tag] || 'var(--tag-other)';
      div.appendChild(dot);
    }

    const num = document.createElement('span');
    num.className = 'date-num';
    num.textContent = day;
    div.prepend(num);

    div.dataset.year = year;
    div.dataset.month = month;
    div.dataset.day = day;
    div.addEventListener('click', () => openModal(year, month, day));
    return div;
  }

  function openModal(year, month, day) {
    const overlay = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const dateEl = document.getElementById('modal-date');
    const note = document.getElementById('modal-note');
    const delBtn = document.getElementById('modal-delete');
    const tagBtns = document.querySelectorAll('.tag-btn');

    const entry = getEntry(year, month, day);
    const dateStr = `${year} 年 ${month + 1} 月 ${day} 日`;

    title.textContent = `🌙 ${dateStr}`;
    dateEl.textContent = '';
    note.value = entry ? entry.note || '' : '';
    delBtn.style.display = entry ? 'inline-block' : 'none';

    // Clear tags
    tagBtns.forEach(b => b.classList.remove('active'));
    if (entry && entry.tag) {
      tagBtns.forEach(b => {
        if (b.dataset.tag === entry.tag) b.classList.add('active');
      });
    }

    overlay.classList.add('show');

    // Store target date
    overlay.dataset.year = year;
    overlay.dataset.month = month;
    overlay.dataset.day = day;

    note.focus();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function saveModal() {
    const overlay = document.getElementById('modal');
    const year = parseInt(overlay.dataset.year);
    const month = parseInt(overlay.dataset.month);
    const day = parseInt(overlay.dataset.day);
    const note = document.getElementById('modal-note').value.trim();
    const activeTag = document.querySelector('.tag-btn.active');

    if (!note && !activeTag) {
      setEntry(year, month, day, null);
    } else {
      setEntry(year, month, day, {
        note: note || '',
        tag: activeTag ? activeTag.dataset.tag : 'other',
        timestamp: Date.now()
      });
    }
    closeModal();
  }

  function deleteEntry() {
    const overlay = document.getElementById('modal');
    const year = parseInt(overlay.dataset.year);
    const month = parseInt(overlay.dataset.month);
    const day = parseInt(overlay.dataset.day);
    setEntry(year, month, day, null);
    closeModal();
  }

  function bindEvents() {
    document.getElementById('prev-btn').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      render();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-save').addEventListener('click', saveModal);
    document.getElementById('modal-delete').addEventListener('click', deleteEntry);

    // Tag selection
    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        if (document.getElementById('modal').classList.contains('show')) saveModal();
      }
    });

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
  }

  // Init
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
