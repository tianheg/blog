<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="在浏览器里把 PDF 的指定页抽出来另存，文件不上传">
  <meta name="theme-color" content="#f7f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121c22" media="(prefers-color-scheme: dark)">
  <title>PDF 提取 | Tianhe Gao</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a class="back" href="/projects/">← 全部项目</a>

  <h1>PDF 提取</h1>
  <p class="intro">选一个 PDF，填要哪几页，抽出来另存一份。全程在浏览器里跑，文件不会上传到任何地方。</p>

  <label class="drop" id="drop" for="pdfinput">
    <input type="file" id="pdfinput" accept="application/pdf,.pdf" hidden>
    <span class="drop-mark">PDF</span>
    <span class="drop-text" id="dropText">点击选择，或把文件拖进来</span>
  </label>

  <p class="file-info" id="fileInfo" hidden></p>

  <div class="field">
    <label for="rangeSelector">页码范围</label>
    <div class="field-row">
      <input type="text" id="rangeSelector" placeholder="1-3" inputmode="numeric" autocomplete="off" spellcheck="false">
      <button id="extractBtn" class="primary" disabled>提取</button>
    </div>
    <p class="hint" id="hint">支持 <code>1-3</code> 连续、<code>2,5,7</code> 不连续、<code>4</code> 单页</p>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
