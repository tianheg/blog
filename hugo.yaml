baseURL: "https://tianheg.co/"
pluralizeListTitles: false
summaryLength: 42
title: "Tianhe Gao"
enableGitInfo: true
hasCJKLanguage: true
timeZone: Asia/Shanghai

security:
  exec:
    # v0.165.0 起 tailwindcss 移出默认白名单 (#15178)，此处显式恢复
    # 注意：此列表整体替换默认值，必须列全
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

build:
  cachebusters:
    - source: "layouts/.*"
      target: css
    - source: "assets/ts/.*"
      target: js
    - source: "assets/css/.*"
      target: css

frontmatter:
  date:
    - date
    - :filename
  lastmod:
    - lastmod
    - :git
    - :fileModTime

markup:
  highlight:
    style: dracula
  tableOfContents:
    startLevel: 2
    endLevel: 3
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: Home
      pageRef: "/"
      weight: 1
    - name: About
      pageRef: "/about"
      weight: 2
    - name: Posts
      pageRef: "/posts"
      weight: 10
    - name: TIL
      pageRef: "/til"
      weight: 11
    - name: Projects
      pageRef: "/projects"
      weight: 12
    - name: Graph
      pageRef: "/graph"
      weight: 13

outputFormats:
  SectionsRSS:
    baseName: index
    mediaType: "application/rss+xml"

outputs:
  home:
    - HTML
    - SectionsRSS
  page:
    - HTML
  section:
    - HTML
    - JSON
  taxonomy:
    - HTML
  term:
    - HTML


permalinks:
  tags: "/tags/:slug/"

services:
  rss:
    limit: 20

taxonomies:
  tag: "tags"
