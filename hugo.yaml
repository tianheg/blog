baseURL: "https://tianheg.co/"
pluralizeListTitles: false
summaryLength: 42
title: "Tianhe Gao"
enableGitInfo: true
hasCJKLanguage: true
timeZone: Asia/Shanghai

security:
  exec:
    # v0.165.0 起 tailwindcss 移出默认白名单 (#15178)，此处显式恢复
    # 注意：此列表整体替换默认值，必须列全
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

build:
  cachebusters:
    - source: "layouts/.*"
      target: css
    - source: "assets/ts/.*"
      target: js
    - source: "assets/css/.*"
      target: css

# content/ 同时是 Obsidian vault：产物不进仓库（.gitignore），也不参与构建/发布。
# 双保险——即使文件已存在于工作区（比如 Windows 侧同步过来），也不会出现在 public/。
ignoreFiles:
  - '\.canvas$'
  - '\.obsidian/'
  - '(^|/)\.trash/'

frontmatter:
  date:
    - date
    - :filename
  lastmod:
    - lastmod
    - :git
    - :fileModTime

markup:
  highlight:
    style: dracula
  tableOfContents:
    startLevel: 2
    endLevel: 6
  goldmark:
    renderer:
      unsafe: true
    parser:
      # md 属性语法 {#id} / {.class}：CUSTOM_ID 锚点与块级属性依赖此开关
      attribute:
        block: true
        title: true
    extensions:
      # org 的脚注没有返回箭头，置空以对齐渲染
      footnote:
        backlinkHTML: ''
      # 与 go-org 的智能标点行为对齐：转换 ... / -- / --- 为 … / – / —，但不动引号
      typographer:
        disable: false
        apostrophe: "'"
        leftDoubleQuote: '"'
        rightDoubleQuote: '"'
        leftSingleQuote: "'"
        rightSingleQuote: "'"

menu:
  main:
    - name: Home
      pageRef: "/"
      weight: 1
    - name: About
      pageRef: "/about"
      weight: 2
    - name: Posts
      pageRef: "/posts"
      weight: 10
    - name: TIL
      pageRef: "/til"
      weight: 11
    - name: Projects
      pageRef: "/projects"
      weight: 12

outputFormats:
  SectionsRSS:
    baseName: index
    mediaType: "application/rss+xml"

outputs:
  home:
    - HTML
    - SectionsRSS
  page:
    - HTML
  section:
    - HTML
    - JSON
  taxonomy:
    - HTML
  term:
    - HTML


permalinks:
  tags: "/tags/:slug/"

services:
  rss:
    limit: 20

taxonomies:
  tag: "tags"
