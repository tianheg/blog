# 相册放行名单 —— 唯一人工真源。
#
# 规则：只有在这里出现的照片才会在 /photos/ 展示、才会被 Worker 放行；
# 改名单 = 改这里，然后重跑 `python3 scripts/gen-photos-data.py`（派生机器产物，勿手改）。
# 文件名可写裸名（按文件名前 4 位定年份）或带年份 `2026/xxx.webp`；全库必须唯一匹配。
#
# photos: 没归入合集的散片，页面直出（顺序 = 展示顺序）
# series: 系列合集；num=编号(唯一正整数,按编号排序)，空系列不渲染，名字必填、不可重复
# 同一张照片只能出现一处（散片与合集互斥），gen 撞见会报错退出
photos: []   # 散片暂撤（2026-10-07）—— 页面只留合集；按需再往这列点名

series:
  - num: 1   # 系列编号：唯一、正整数，页面按编号排序（注意别写 no: 那是 YAML 布尔）
